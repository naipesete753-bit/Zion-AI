name: Verify Zion AI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run check

  android-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Use JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm ci
      - name: Sync Capacitor Android project
        run: npm run android:sync
      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          # O runner executa bash com -e; desativamos temporariamente para publicar o erro do Gradle como anotação.
          set +e
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/zion-gradle.log"
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            diagnostic=$(tail -n 100 "$RUNNER_TEMP/zion-gradle.log" | tr '\n' ' ' | cut -c1-6000)
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//$'\r'/'%0D'}
            echo "::error file=android/build.gradle,line=1::${diagnostic}"
            exit "$build_status"
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zion-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
