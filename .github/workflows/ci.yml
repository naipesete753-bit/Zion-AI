name: Verify Zion AI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run check

  android-apk:
    name: Build Android debug APK
    # Evita recriar o APK quando a própria automação publica o arquivo atualizado.
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Use JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Sync Capacitor Android project
        run: npm run android:sync
      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          # O runner executa bash com -e; desativamos temporariamente para publicar o erro do Gradle como anotação.
          set +e
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/zion-gradle.log"
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            diagnostic=$(awk '
              /FAILURE: Build failed|What went wrong|Execution failed for task|Caused by:|A problem occurred|Android resource linking failed/ { show=1; lines=0 }
              show { print; lines++; if (lines >= 12) show=0 }
            ' "$RUNNER_TEMP/zion-gradle.log" | tail -n 60)
            if [ -z "$diagnostic" ]; then diagnostic=$(tail -n 100 "$RUNNER_TEMP/zion-gradle.log"); fi
            diagnostic=$(printf '%s' "$diagnostic" | tr '\n' ' ' | cut -c1-6000)
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//$'\r'/'%0D'}
            echo "::error file=android/build.gradle,line=1::${diagnostic}"
            exit "$build_status"
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: zion-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct APK download
        if: github.event_name == 'push'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/Zion-AI-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/Zion-AI-debug.apk
          if git diff --cached --quiet; then
            echo "O APK publicado já está atualizado."
            exit 0
          fi
          git commit -m "build: update Android debug APK [skip ci]"
          git push origin "HEAD:${BRANCH_NAME}"
